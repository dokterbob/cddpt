        posicional destas imagens foi realizado um ajustamento das ortoimagens que
        apresentavam erros posicionais usando como refer\xEAncia a cobertura das ortoimagens
        de 2010.\",\"descriptionEn\":\"Mosaic of aerial photographs of mainland Portugal
        acquired on false-color infrared film, obtained in August and September 1995
