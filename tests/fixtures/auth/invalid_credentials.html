<!DOCTYPE html>
<!--
  Modeled on DGT's real Keycloak response to a wrong-password attempt
  (one deliberate live probe with a bogus username, never the real
  account -- see docs/PLAN.md's M4 pre-work and this task's
  secrets-handling rules). The real element carrying the error text is
  `.kc-feedback-text` (there is no `#input-error` id, and no `.alert-error`
  class, in this realm's PatternFly v5 theme -- both were checked live and
  do not match).
-->
<html lang="pt">
<head><meta charset="UTF-8"><title>Iniciar sessão</title></head>
<body>
<div id="kc-form">
  <div id="kc-form-wrapper">
    <form id="kc-form-login" class="pf-v5-c-form pf-v5-u-w-100" action="https://auth.cdd.dgterritorio.gov.pt/realms/dgterritorio/login-actions/authenticate?session_code=PLACEHOLDER_SESSION_CODE&amp;execution=PLACEHOLDER_EXECUTION&amp;client_id=aai-oidc-dgt&amp;tab_id=PLACEHOLDER_TAB_ID&amp;client_data=PLACEHOLDER_CLIENT_DATA" method="post" novalidate="novalidate">
      <div class="pf-v5-c-form__group">
        <input id="username" name="username" value="cddpt-probe-invalid@example.invalid" type="text" autocomplete="username" aria-invalid="true"/>
        <div id="input-error-container-username">
          <div class="pf-v5-c-form__helper-text" aria-live="polite">
            <div class="pf-v5-c-helper-text">
              <div class="pf-v5-c-helper-text__item pf-m-error" id="input-error-username">
                <span class="pf-v5-c-helper-text__item-text pf-m-error kc-feedback-text">
                  Nome de utilizador ou palavra-passe inválida.
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="pf-v5-c-form__group">
        <input id="password" name="password" value="" type="password" autocomplete="current-password" aria-invalid="true"/>
        <div id="input-error-container-password"></div>
      </div>
      <input type="hidden" id="id-hidden-input" name="credentialId" />
      <button class="pf-v5-c-button pf-m-primary pf-m-block" name="login" id="kc-login" type="submit">Entrar</button>
    </form>
  </div>
</div>
</body>
</html>
