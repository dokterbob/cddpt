<!DOCTYPE html>
<!--
  Modeled on DGT's real Keycloak login page (realm "dgterritorio", theme
  PatternFly v5), fetched once (anonymous, pre-login GET only -- no
  credentials submitted) to capture the actual form id/action/field names,
  then hand-reduced and with all per-session state (session_code, execution,
  tab_id, client_data) replaced by fixed placeholder tokens -- see
  docs/PLAN.md's M4 pre-work and this task's secrets-handling rules.
-->
<html lang="pt">
<head><meta charset="UTF-8"><title>Iniciar sessão</title></head>
<body>
<div class="pf-v5-c-login">
  <div class="pf-v5-c-login__main">
    <div class="pf-v5-c-login__main-body">
      <div id="kc-form">
        <div id="kc-form-wrapper">
          <form id="kc-form-login" class="pf-v5-c-form pf-v5-u-w-100" onsubmit="login.disabled = true; return true;" action="https://auth.cdd.dgterritorio.gov.pt/realms/dgterritorio/login-actions/authenticate?session_code=PLACEHOLDER_SESSION_CODE&amp;execution=PLACEHOLDER_EXECUTION&amp;client_id=aai-oidc-dgt&amp;tab_id=PLACEHOLDER_TAB_ID&amp;client_data=PLACEHOLDER_CLIENT_DATA" method="post" novalidate="novalidate">
            <div class="pf-v5-c-form__group">
              <label for="username" class="pf-v5-c-form__label">Nome de utilizador ou e-mail</label>
              <input id="username" name="username" value="" type="text" autocomplete="username" autofocus aria-invalid=""/>
              <div id="input-error-container-username"></div>
            </div>
            <div class="pf-v5-c-form__group">
              <label for="password" class="pf-v5-c-form__label">Palavra-passe</label>
              <input id="password" name="password" value="" type="password" autocomplete="current-password" aria-invalid=""/>
              <div id="input-error-container-password"></div>
            </div>
            <input type="hidden" id="id-hidden-input" name="credentialId" />
            <div class="pf-v5-c-form__group">
              <div class="pf-v5-c-form__actions">
                <button class="pf-v5-c-button pf-m-primary pf-m-block" name="login" id="kc-login" type="submit">Entrar</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
