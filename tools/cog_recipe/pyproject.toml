[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cddpt-build-cog"
version = "0.1.0"
description = """\
Companion tool for cddpt: re-encode a directory of DGT CDD GeoTIFF DTM/DSM tiles into a \
single seamless Cloud-Optimized GeoTIFF (LERC_ZSTD, native resolution, guaranteed 10 m \
overview level for contour generation).\
"""
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["../../LICENSE"]
authors = [{ name = "Mathijs de Bruin", email = "mathijs@mathijsfietst.nl" }]
keywords = ["dgt", "cdd", "portugal", "geodata", "cog", "gdal", "rasterio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]

# Deliberately independent of the root cddpt project's dependency set (see
# README "Deviations from docs/build-cog.md"): this is pure local raster
# processing, no auth/HTTP/STAC stack needed. rasterio's wheel bundles its
# own GDAL build (checked to support LERC_ZSTD at import time -- see
# gdal_support.py) so no system GDAL / osgeo install is required.
dependencies = [
    "rasterio>=1.3.3",
    "rio-cogeo>=7.0",
    "typer>=0.12",
    "rich>=13.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "numpy>=1.26",
    "mypy>=1.10",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/dokterbob/cddpt"
Repository = "https://github.com/dokterbob/cddpt"

[project.scripts]
build-cog = "cog_recipe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cog_recipe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/cog_recipe"]

[[tool.mypy.overrides]]
module = ["rio_cogeo.*", "rasterio.*", "tqdm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/cog_recipe"]
